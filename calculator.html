<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(60, 60, 120, 0.15);
  }
  h1 { margin: 0 0 20px; font-size: 1.5rem; text-align: center; color: #312e81; }
  label { display: block; margin: 14px 0 6px; font-size: 0.9rem; font-weight: 600; color: #444; }
  input[type="number"], select {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1.5px solid #c7c9e0;
    border-radius: 8px;
    outline: none;
    background: #fff;
  }
  input:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
  .buttons { display: flex; gap: 10px; margin-top: 22px; }
  button {
    flex: 1;
    padding: 11px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #calc { background: #4f46e5; color: #fff; }
  #calc:hover { background: #4338ca; }
  #clear { background: #e5e7eb; color: #333; }
  #clear:hover { background: #d1d5db; }
  .result {
    margin-top: 22px;
    padding: 14px;
    min-height: 54px;
    border-radius: 8px;
    background: #eef2ff;
    color: #1e1b4b;
    font-size: 1.15rem;
    text-align: center;
    word-break: break-all;
  }
  .result.error { background: #fee2e2; color: #b91c1c; font-size: 1rem; }
</style>
</head>
<body>
  <div class="card" id="calcForm">
    <h1>Simple Calculator</h1>

    <label for="num1">First number</label>
    <input type="number" id="num1" step="any" placeholder="Enter first number">

    <label for="operation">Operation</label>
    <select id="operation">
      <option value="add">Addition (+)</option>
      <option value="subtract">Subtraction (−)</option>
      <option value="multiply">Multiplication (×)</option>
      <option value="divide">Division (÷)</option>
    </select>

    <label for="num2">Second number</label>
    <input type="number" id="num2" step="any" placeholder="Enter second number">

    <div class="buttons">
      <button type="button" id="calc">Calculate</button>
      <button type="button" id="clear">Clear</button>
    </div>

    <div class="result" id="result" aria-live="polite">Result will appear here</div>
  </div>

<script>
  const form = document.getElementById("calcForm");
  const num1 = document.getElementById("num1");
  const num2 = document.getElementById("num2");
  const op = document.getElementById("operation");
  const result = document.getElementById("result");
  const symbols = { add: "+", subtract: "−", multiply: "×", divide: "÷" };

  function show(text, isError) {
    result.textContent = text;
    result.classList.toggle("error", !!isError);
  }

  function calculate() {

    if (num1.value.trim() === "" || num2.value.trim() === "") {
      show("Please enter both numbers.", true);
      return;
    }

    const a = parseFloat(num1.value);
    const b = parseFloat(num2.value);
    let answer;

    switch (op.value) {
      case "add":      answer = a + b; break;
      case "subtract": answer = a - b; break;
      case "multiply": answer = a * b; break;
      case "divide":
        if (b === 0) { show("Error: Cannot divide by zero.", true); return; }
        answer = a / b;
        break;
    }

    // Round to avoid floating-point noise (e.g. 0.1 + 0.2)
    answer = parseFloat(answer.toPrecision(12));
    show(a + " " + symbols[op.value] + " " + b + " = " + answer, false);
  }

  document.getElementById("calc").addEventListener("click", calculate);
  [num1, num2].forEach(function (el) {
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") calculate();
    });
  });

  document.getElementById("clear").addEventListener("click", function () {
    num1.value = "";
    num2.value = "";
    op.selectedIndex = 0;
    show("Result will appear here", false);
    num1.focus();
  });
</script>
</body>
</html>
